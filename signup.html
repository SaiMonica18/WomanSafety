<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Safety - Signup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Safety Network</h1>
        <h2>Create an Account</h2>
        
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="regName" placeholder="Enter full name" required>
        </div>
        
        <div class="input-group">
            <label>Mobile Number</label>
            <input type="tel" id="regMobile" placeholder="Enter 10-digit mobile number" required>
        </div>

        <div class="input-group">
            <label>Age</label>
            <input type="number" id="regAge" placeholder="Enter your age" required>
        </div>
        
        <div class="input-group">
            <label>Gender</label>
            <select id="regGender" required>
                <option value="">Select Gender</option>
                <option value="Female">Female</option>
                <option value="Male">Male</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="regPassword" placeholder="Create a strong password" required>
        </div>
        
        <button class="btn btn-primary" onclick="signup()">Sign Up</button>
        
        <p style="margin-top: 15px; font-size: 0.9rem;">
            Already have an account? <a href="login.html" style="color: #007bff; text-decoration: none;">Login here</a>
        </p>
    </div>

    <script>
        function signup() {
            const name = document.getElementById("regName").value.trim();
            const mobile = document.getElementById("regMobile").value.trim();
            const age = document.getElementById("regAge").value.trim();
            const gender = document.getElementById("regGender").value;
            const password = document.getElementById("regPassword").value;

            if (!name || !mobile || !age || !gender || !password) {
                alert("Please fill in all details.");
                return;
            }

            // Create user object
            const user = { name, mobile, age, gender, password };

            // Save to local storage (Simulating a database for authentication)
            localStorage.setItem("user_" + mobile, JSON.stringify(user));
            
            alert("Account created successfully! Please login.");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
