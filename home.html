<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Women Safety - Emergency SOS</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">

        <h1>Smart Women Safety</h1>

        <h2>Emergency SOS</h2>


        <!-- USER INFORMATION -->

        <p id="userInfo"></p>


        <!-- PROFILE BUTTON -->

        <button id="profileButton"
                class="profile-button">

            👤 My Profile

        </button>


        <!-- PROFILE SECTION -->

        <div id="profileSection"
             class="profile-section">


            <h3>My Profile</h3>


            <!-- NAME -->

            <label>Name</label>

            <input
                type="text"
                id="profileName"
                placeholder="Enter your name"
            >


            <!-- PHONE -->

            <label>Phone Number</label>

            <input
                type="tel"
                id="profilePhone"
                placeholder="Enter phone number"
            >


            <!-- GENDER -->

            <label>Gender</label>

            <input
                type="text"
                id="profileGender"
                readonly
            >


            <!-- EMERGENCY EMAIL -->

            <label>Emergency Email</label>

            <input
                type="email"
                id="profileEmail"
                placeholder="Enter emergency email"
            >


            <!-- EMERGENCY CONTACT -->

            <h3>Emergency Contact</h3>


            <label>Contact Name</label>

            <input
                type="text"
                id="contactName"
                placeholder="Enter emergency contact name"
            >


            <label>Contact Email</label>

            <input
                type="email"
                id="contactEmail"
                placeholder="Enter emergency contact email"
            >


            <!-- UPDATE BUTTON -->

            <button
                id="updateProfileButton"
                class="update-button">

                Update Profile

            </button>

        </div>


        <!-- SOS BUTTON -->

        <button id="sosButton">

            🚨 EMERGENCY SOS

        </button>


        <!-- STATUS -->

        <p id="status"></p>


    </div>


    <script
        type="module"
        src="home.js">
    </script>


</body>

</html>
