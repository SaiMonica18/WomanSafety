<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Safety - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Smart Safety</h1>
        
        <div class="user-info" id="userInfo">
            <!-- Profile details will load here -->
        </div>

        <!-- Emergency Flow Buttons -->
        <button id="sosButton" class="btn btn-danger">🚨 EMERGENCY SOS</button>
        <button id="safeButton" class="btn btn-success" style="display: none;">✅ I AM SAFE</button>
        
        <div id="status" class="status-box">System Ready.</div>
        
        <!-- Logout -->
        <button id="logoutBtn" class="btn btn-logout">Logout</button>
    </div>

    <!-- Ensure Firebase script is treated as a module -->
    <script type="module" src="home.js"></script>
</body>
</html>
